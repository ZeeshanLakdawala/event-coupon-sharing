name: Bug report
description: Report a reproducible problem without sharing private event data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include attendee emails, coupon codes, CSV exports, credentials, or session data. For security vulnerabilities, use SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the user-visible problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the smallest safe set of steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, deployment mode, and commit SHA
    validations:
      required: true